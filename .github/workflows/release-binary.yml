name: Release standalone binary

on:
  push:
    branches:
      - feature/standalone-binary-release-redesign
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: graphify-linux
            binary: graphify_cli
            artifact-binary: graphify
          - os: macos-latest
            artifact: graphify-macos
            binary: graphify_cli
            artifact-binary: graphify
          - os: windows-latest
            artifact: graphify-windows
            binary: graphify.exe
            artifact-binary: graphify.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build standalone binary with Nuitka
        shell: bash
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --onefile-tempdir-spec="{TEMP}/graphify_{PID}_{TIME}" \
            --assume-yes-for-downloads \
            --include-data-dir="graphify/always_on=graphify/always_on" \
            --include-data-dir="graphify/skills=graphify/skills" \
            --include-data-files="graphify/skill*.md=graphify/" \
            --output-filename="${{ matrix.binary }}" \
            --python-flag=-m \
            graphify/

      - name: Move binary to dist/
        shell: bash
        run: |
          mkdir -p dist
          mv "${{ matrix.binary }}" dist/"${{ matrix.artifact-binary }}"

      - name: Smoke test standalone binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist/${{ matrix.artifact-binary }}"
          chmod +x "$BIN"

          "$BIN" --version
          "$BIN" --help

          mkdir -p smoke-input
          printf 'def add(a, b):\n    return a + b\n' > smoke-input/example.py

          "$BIN" extract smoke-input \
            --out smoke-output \
            --no-cluster \
            --max-workers 1

          test -s smoke-output/graphify-out/graph.json
          "$BIN" query "add" --graph smoke-output/graphify-out/graph.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact-binary }}

  release:
    name: Upload to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*

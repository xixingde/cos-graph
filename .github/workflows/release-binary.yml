name: Release standalone binary

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: graphify-linux
            binary: graphify
          - os: macos-latest
            artifact: graphify-macos-arm64
            binary: graphify-arm64
          - os: macos-13
            artifact: graphify-macos-x86_64
            binary: graphify-x86_64
          - os: windows-latest
            artifact: graphify-windows
            binary: graphify.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build standalone binary with Nuitka
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --follow-imports \
            --include-data-dir="graphify/always_on=graphify/always_on" \
            --include-data-dir="graphify/skills=graphify/skills" \
            --include-data-files="graphify/skill*.md=graphify/" \
            --enable-plugin=anti-bloat \
            --output-filename="${{ matrix.binary }}" \
            graphify/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
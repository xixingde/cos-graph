name: Release standalone binary

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: graphify-linux
            binary: graphify_cli
            artifact-binary: graphify
          - os: macos-latest
            artifact: graphify-macos
            binary: graphify_cli
            artifact-binary: graphify
          - os: windows-latest
            artifact: graphify-windows
            binary: graphify.exe
            artifact-binary: graphify.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build standalone binary with Nuitka
        shell: bash
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --include-data-dir="graphify/always_on=graphify/always_on" \
            --include-data-dir="graphify/skills=graphify/skills" \
            --include-data-files="graphify/skill*.md=graphify/" \
            --output-filename="${{ matrix.binary }}" \
            --python-flag=-m \
            graphify/

      - name: Rename binary (Linux/macOS only)
        if: runner.os != 'Windows'
        shell: bash
        run: mv dist/graphify_cli dist/graphify

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact-binary }}

  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
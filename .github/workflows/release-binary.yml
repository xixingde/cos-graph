name: Release standalone binary

on:
  push:
    branches:
      - feature/standalone-binary-release-redesign
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: graphify-linux
            binary: graphify_cli
            artifact-binary: graphify
          - os: macos-latest
            artifact: graphify-macos
            binary: graphify_cli
            artifact-binary: graphify
          - os: windows-latest
            artifact: graphify-windows
            binary: graphify.exe
            artifact-binary: graphify.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build standalone binary with Nuitka
        shell: bash
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --onefile-tempdir-spec="{TEMP}/graphify_{PID}_{TIME}" \
            --assume-yes-for-downloads \
            --include-package=tree_sitter_javascript \
            --include-package=tree_sitter_typescript \
            --include-package-data=tree_sitter_javascript \
            --include-package-data=tree_sitter_typescript \
            --include-data-dir="graphify/always_on=graphify/always_on" \
            --include-data-dir="graphify/skills=graphify/skills" \
            --include-data-files="graphify/skill*.md=graphify/" \
            --output-filename="${{ matrix.binary }}" \
            --python-flag=-m \
            graphify/

      - name: Move binary to dist/
        shell: bash
        run: |
          mkdir -p dist
          mv "${{ matrix.binary }}" dist/"${{ matrix.artifact-binary }}"

      - name: Smoke test standalone binary
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist/${{ matrix.artifact-binary }}"
          chmod +x "$BIN"

          "$BIN" --version
          "$BIN" --help

          mkdir -p smoke-input
          printf 'def add(a, b):\n    return a + b\n' > smoke-input/example.py
          printf 'function multiply(a, b) { return a * b; }\n' > smoke-input/example.js
          printf 'export function formatUser(name: string): string { return name.trim(); }\n' > smoke-input/example.ts
          printf ';(function(root, factory) { root.bundle = factory(); }(this, function() { function bundledValue() { return 42; } return { bundledValue }; }));\n' > smoke-input/iife.js

          "$BIN" extract smoke-input \
            --out smoke-output \
            --no-cluster \
            --max-workers 1

          test -s smoke-output/graphify-out/graph.json
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('smoke-output/graphify-out/graph.json','utf8')); const labels=g.nodes.map(n=>String(n.label)); if(!labels.some(x=>x.includes('multiply'))||!labels.some(x=>x.includes('formatUser'))||!labels.some(x=>x.includes('bundledValue'))) process.exit(1);"
          "$BIN" query "add" --graph smoke-output/graphify-out/graph.json

          # Exercise the staged CSC-agent pipeline with an intentionally tiny
          # PATH. The binary must not discover or launch python/py/uv/pip.
          mkdir -p no-python-path agent-input
          # Keep this above graphify.extract._PARALLEL_THRESHOLD (20) so the
          # Windows onefile build is tested against a realistic codebase size.
          for i in $(seq 1 25); do
            printf 'def multiply_%s(a, b):\n    return a * b\n' "$i" > "agent-input/example_${i}.py"
          done
          printf 'export const divide = (a, b) => a / b;\n' > agent-input/example.js
          cp smoke-input/iife.js agent-input/iife.js
          printf '# Multiplication service\n\nThe service performs arithmetic operations.\n' > agent-input/README.md
          ABS_BIN="$(pwd)/$BIN"

          env PATH="$(pwd)/no-python-path" "$ABS_BIN" agent-prepare agent-input \
            --out agent-output \
            --run-id ci-smoke \
            --max-workers 1 \
            --json

          # Simulate a Windows agent/editor that writes UTF-8 JSON with a BOM.
          # agent-build must accept it and merge semantic data with AST output.
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('agent-output/graphify-out/.graphify_agent_plan.json','utf8')); if(p.chunks.length!==1) process.exit(1); const src=p.chunks[0].files[0]; const chunk={nodes:[{id:'concept:multiplication-service',label:'Multiplication Service',type:'concept',file_type:'concept',source_file:src},{id:'concept:arithmetic',label:'Arithmetic',type:'concept',file_type:'concept',source_file:src}],edges:[{source:'concept:multiplication-service',target:'concept:arithmetic',relation:'performs',confidence:'EXTRACTED',confidence_score:1,source_file:src}],hyperedges:[],input_tokens:10,output_tokens:5}; fs.writeFileSync(p.chunks[0].output_path,'\ufeff'+JSON.stringify(chunk));"

          env PATH="$(pwd)/no-python-path" "$ABS_BIN" agent-build agent-input \
            --out agent-output \
            --run-id ci-smoke \
            --json

          node -e "const fs=require('fs'); const p='agent-output/graphify-out/.graphify_analysis.json'; const a=JSON.parse(fs.readFileSync(p,'utf8')); const labels=Object.fromEntries(Object.keys(a.communities).map(k=>[k,'CI Community '+k])); fs.writeFileSync('agent-output/graphify-out/.graphify_labels.json',JSON.stringify(labels));"

          env PATH="$(pwd)/no-python-path" "$ABS_BIN" agent-finalize agent-input \
            --out agent-output \
            --run-id ci-smoke \
            --json

          test -s agent-output/graphify-out/graph.json
          test -s agent-output/graphify-out/GRAPH_REPORT.md
          test -s agent-output/graphify-out/graph.html
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('agent-output/graphify-out/graph.json','utf8')); if(!Array.isArray(g.links)||Object.prototype.hasOwnProperty.call(g,'edges')) process.exit(1);"

          env PATH="$(pwd)/no-python-path" "$ABS_BIN" vocab \
            --graph agent-output/graphify-out/graph.json \
            --output agent-output/graphify-out/.vocab.txt
          grep -Fxq "multiplication" agent-output/graphify-out/.vocab.txt

          printf 'Multiplication Service performs Arithmetic.\n' \
            > agent-output/graphify-out/.query-answer.txt
          env PATH="$(pwd)/no-python-path" "$ABS_BIN" save-result \
            --question "What performs arithmetic?" \
            --answer-file agent-output/graphify-out/.query-answer.txt \
            --type query \
            --nodes "Multiplication Service" "Arithmetic" \
            --outcome useful \
            --memory-dir agent-output/graphify-out/memory
          test -n "$(find agent-output/graphify-out/memory -name 'query_*.md' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact-binary }}

  release:
    name: Upload to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
